name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittests:
    name: Run Unit Tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true

      matrix:
        include:
          - name: Windows x64 / MSVC
            os: windows-latest
            preset: msvc-x64
            vcpkg_triplet: x64-windows

          - name: Windows x64 / Clang
            os: windows-latest
            preset: llvm-x64
            vcpkg_triplet: x64-windows

          - name: Windows ARM64 / MSVC
            os: windows-11-arm
            preset: msvc-arm64
            vcpkg_triplet: arm64-windows

          - name: Linux x64 / GCC
            os: ubuntu-latest
            preset: gcc-linux-x64
            vcpkg_triplet: x64-linux-dynamic

          - name: Linux ARM64 / GCC
            os: ubuntu-24.04-arm
            preset: gcc-linux-arm64
            vcpkg_triplet: arm64-linux

          - name: macOS ARM64 / AppleClang
            os: macos-latest
            preset: apple-clang-macos-arm64
            vcpkg_triplet: arm64-osx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Install GTest
        run: vcpkg install gtest:${{ matrix.vcpkg_triplet }}

      - name: Configure
        working-directory: tests/unittest
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: tests/unittest
        run: cmake --build --preset ${{ matrix.preset }} --config Release --parallel

      - name: Test
        working-directory: tests/unittest/build/${{ matrix.preset }}
        run: ctest --build-config Release --output-on-failure

  clang-format:
    name: Run Clang Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install clang-format 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get update
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          find include \( -name "*.h" -o -name "*.cpp" \) | \
          xargs clang-format-22 --dry-run --Werror

  clang-tidy:
    name: Run Clang Tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install clang-tidy 19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get update
          sudo apt-get install -y clang-tidy-19

      - name: Run clang-tidy
        run: |
          find include \( -name "*.h" -o -name "*.cpp" \) | \
          xargs -I{} clang-tidy-19 {} --header-filter="include/.*" -- -x c++ -std=c++20 -I include

  all-checks:
    name: Check Results
    runs-on: ubuntu-latest
    needs: [unittests, clang-format, clang-tidy]

    steps:
      - run: echo "All checks passed"
